name: Diary – Weekly

on:
  schedule:
    - cron: '0 13 * * 0'   # 22:00 JST Sunday (13:00 UTC)
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system fonts
        run: sudo apt-get install -y fonts-ipafont-gothic

      - name: Install Python dependencies
        run: pip install -r diary/scripts/requirements.txt

      - name: Generate weekly PDF
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: cd diary/scripts && python generate_weekly.py

      - name: Commit generated PDF
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "📔 auto: weekly diary"
          file_pattern: diary/output/*.pdf
