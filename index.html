<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>STUDYMANAGER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Doto:wght@300..900&family=DM+Mono:wght@300;400;500&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:        #000000;
  --bg-1:      #0a0a0a;
  --bg-2:      #141414;
  --line:      rgba(255,255,255,0.12);
  --line-soft: rgba(255,255,255,0.06);
  --fg:        #f2f2f2;
  --fg-dim:    #8a8a8a;
  --fg-faint:  #555555;
  --accent:    #ff3b30;
  --accent-dim:#7a1d18;
  --ok:        #d8d8d8;
  --on-fg:     #000000;
  --fg-strong: #ffffff;
  --bar-bg:    rgba(0,0,0,0.85);
  --dot:       rgba(255,255,255,0.045);
  --r:   0px;
  --r-pill: 999px;
  --sp: 16px;
  --f-disp: 'Doto', 'Noto Sans JP', monospace;
  --f-mono: 'DM Mono', 'Noto Sans JP', monospace;
  --nav-w: 230px;
}
:root.theme-light{
  --bg:        #ffffff;
  --bg-1:      #f4f4f4;
  --bg-2:      #e9e9e9;
  --line:      rgba(0,0,0,0.30);
  --line-soft: rgba(0,0,0,0.16);
  --fg:        #0d0d0d;
  --fg-dim:    #444444;
  --fg-faint:  #707070;
  --accent:    #ff3b30;
  --accent-dim:#e89490;
  --ok:        #2b2b2b;
  --on-fg:     #ffffff;
  --fg-strong: #000000;
  --bar-bg:    rgba(255,255,255,0.90);
  --dot:       rgba(0,0,0,0.08);
}
/* ─── BASE: リセット・ボディ・グローバルユーティリティ ─── */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  background:var(--bg);
  color:var(--fg);
  font-family:var(--f-mono);
  font-size:14px;
  line-height:1.5;
  letter-spacing:0.02em;
  background-image:radial-gradient(var(--dot) 1px, transparent 1px);
  background-size:22px 22px;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--bg-2);}
::selection{background:var(--accent);color:#000;}
.dot-label{font-family:var(--f-disp);text-transform:lowercase;letter-spacing:0.12em;}
.mono-up{font-family:var(--f-mono);text-transform:uppercase;letter-spacing:0.18em;font-size:11px;color:var(--fg-dim);}
/* ─── LAYOUT: アプリシェル・トップバー・サイドナビ ─── */
#app{min-height:100vh;}
.app-shell{display:flex;min-height:100vh;}
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;border-bottom:1px solid var(--line);
  position:sticky;top:0;background:var(--bar-bg);backdrop-filter:blur(8px);z-index:30;
}
.brand{display:flex;align-items:center;gap:10px;}
.brand .glyph{width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent);}
.brand .name{font-family:var(--f-disp);font-weight:600;letter-spacing:0.18em;font-size:15px;}
.avatar{
  width:34px;height:34px;border-radius:50%;border:1px solid var(--line);
  background:var(--bg-2);color:var(--fg);font-family:var(--f-disp);font-weight:700;
  display:grid;place-items:center;cursor:pointer;font-size:14px;
}
.avatar:hover{border-color:var(--accent);}
.content-col{width:100%;min-width:0;}
.panel{overflow:hidden;}
.sidenav{display:none;}
@media(min-width:768px){
  .app-shell{flex-direction:row;}
  .sidenav{
    display:flex;flex-direction:column;width:var(--nav-w);flex:0 0 var(--nav-w);
    border-right:1px solid var(--line);padding:18px 0;position:sticky;top:0;height:100vh;
  }
  .sidenav-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 18px 22px;}
  .sidenav .brand{padding:0;}
  .sidenav{transition:width .2s ease,flex-basis .2s ease;}
  .app-shell.nav-collapsed .sidenav{width:66px;flex-basis:66px;}
  .app-shell.nav-collapsed .sidenav-head{justify-content:center;}
  .app-shell.nav-collapsed .sidenav-head .brand{display:none;}
  .app-shell.nav-collapsed .nav-item{justify-content:center;gap:0;padding-left:0;padding-right:0;}
  .app-shell.nav-collapsed .nav-item .lbl{display:none;}
  .app-shell.nav-collapsed .nav-item .idx{width:auto;text-align:center;}
  .content-col{flex:1;min-width:0;}
  .topbar{display:none;}
  /* ─── PC TOPBAR: PCレイアウト専用バー ─── */
.pc-topbar{display:flex !important;}
  .bottomnav{display:none !important;}
}
.pc-topbar{display:none;align-items:center;justify-content:flex-end;padding:14px 24px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bar-bg);backdrop-filter:blur(8px);z-index:20;}
/* ─── NAVIGATION: ナビボタン・ボトムナビ ─── */
.nav-toggle{width:30px;height:30px;border:1px solid var(--line);background:var(--bg-2);color:var(--fg-dim);display:grid;place-items:center;cursor:pointer;font-family:var(--f-mono);font-size:15px;line-height:1;flex:0 0 auto;}
.nav-toggle:hover{color:var(--fg);border-color:var(--fg);}
.nav-item{
  display:flex;align-items:center;gap:14px;width:100%;background:none;border:none;
  padding:13px 22px;cursor:pointer;color:var(--fg-dim);text-align:left;position:relative;
}
.nav-item .idx{font-family:var(--f-disp);font-size:12px;color:var(--fg-faint);width:26px;}
.nav-item .lbl{font-family:var(--f-disp);letter-spacing:0.1em;font-size:15px;text-transform:lowercase;}
.nav-item:hover{color:var(--fg);}
.nav-item.active{color:var(--fg);}
.nav-item.active::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;background:var(--accent);}
.nav-item.active .idx{color:var(--accent);}
.bottomnav{
  display:flex;position:fixed;bottom:0;left:0;right:0;z-index:30;
  background:var(--bar-bg);backdrop-filter:blur(10px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.bottomnav .nav-item{flex-direction:column;gap:3px;align-items:center;padding:10px 4px;}
.bottomnav .nav-item .idx{display:none;}
.bottomnav .nav-item.active::before{left:50%;transform:translateX(-50%);top:0;bottom:auto;width:24px;height:3px;}
/* ─── MAIN CONTENT: メインエリア・ビューヘッド ─── */
.main{padding:24px 18px 110px;max-width:920px;margin:0 auto;width:100%;}
@media(min-width:768px){.main{padding:30px 34px 60px;}}
.view-head{display:flex;align-items:baseline;gap:12px;margin-bottom:24px;}
.view-head h1{font-family:var(--f-disp);font-weight:600;font-size:30px;letter-spacing:0.06em;text-transform:lowercase;color:var(--fg-dim);}
.view-head .tag{font-family:var(--f-disp);font-size:13px;color:var(--fg-dim);}
.view-sub{color:var(--fg-dim);font-size:12px;letter-spacing:0.16em;text-transform:uppercase;margin-top:-16px;margin-bottom:24px;}
.panel{background:var(--bg-1);border:1px solid var(--line);padding:20px;}
.panel + .panel{margin-top:16px;}
.sect-title{font-family:var(--f-mono);text-transform:uppercase;letter-spacing:0.2em;font-size:11px;color:var(--fg-dim);margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.sect-title::before{content:"";width:6px;height:6px;background:var(--accent);display:inline-block;}
/* ─── BUTTONS: ボタン全種 ─── */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:1px solid var(--line);background:transparent;color:var(--fg);
  padding:12px 20px;cursor:pointer;letter-spacing:0.12em;text-transform:uppercase;font-size:12px;
  transition:all .15s ease;
}
.btn:hover{border-color:var(--fg);}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--fg);color:var(--on-fg);border-color:var(--fg);}
.btn-primary:hover{background:var(--fg-strong);}
.btn-accent{background:var(--accent);color:#000;border-color:var(--accent);font-weight:500;}
.btn-accent:hover{filter:brightness(1.1);}
.btn-ghost{border-color:transparent;color:var(--fg-dim);padding:8px 12px;}
.btn-ghost:hover{color:var(--fg);border-color:var(--line);}
.btn-danger{border-color:var(--accent-dim);color:var(--accent);}
.btn-danger:hover{background:var(--accent);color:#000;border-color:var(--accent);}
.btn:disabled{opacity:.35;cursor:not-allowed;}
.btn-block{width:100%;}
.btn-lg{padding:18px;font-size:13px;}
/* ─── CHIPS: 選択チップ ─── */
.chip{
  display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);
  background:transparent;color:var(--fg-dim);padding:8px 14px;cursor:pointer;
  border-radius:var(--r-pill);font-size:13px;transition:all .12s ease;white-space:nowrap;
}
.chip:hover{color:var(--fg);border-color:var(--fg-dim);}
.chip.on{border-color:var(--fg);color:var(--fg);background:var(--bg-2);}
.chip .swatch{width:9px;height:9px;border-radius:50%;}
.chip-row{display:flex;flex-wrap:wrap;gap:8px;}
/* ─── FORMS: フォーム・入力・行レイアウト ─── */
.field{margin-bottom:16px;}
.field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:0.16em;color:var(--fg-dim);margin-bottom:7px;}
.input,.textarea,.select{
  width:100%;box-sizing:border-box;background:var(--bg-2);border:1px solid var(--line);color:var(--fg);
  padding:12px 14px;border-radius:var(--r);
}
.input:focus,.textarea:focus,.select:focus{outline:none;border-color:var(--accent);}
input[type="datetime-local"]{-webkit-appearance:none;appearance:none;width:100%;max-width:100%;}
.textarea{resize:vertical;min-height:70px;}
.row{display:flex;gap:12px;}
.row > *{flex:1;min-width:0;}
.empty{color:var(--fg-faint);text-align:center;padding:40px 10px;font-size:13px;letter-spacing:0.1em;}
/* ─── MODAL: モーダル・確認ダイアログ ─── */
.modal-root{position:fixed;inset:0;z-index:100;display:none;}
.modal-root.open{display:block;}
.modal-bg{position:absolute;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(3px);}
.modal{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(560px,calc(100vw - 32px));max-height:88vh;overflow:auto;
  background:var(--bg-1);border:1px solid var(--line);
}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg-1);}
.modal-head h2{font-family:var(--f-disp);font-size:18px;letter-spacing:0.08em;text-transform:lowercase;}
.modal-body{padding:20px;}
.modal-foot{padding:16px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;}
.x-btn{background:none;border:1px solid var(--line);color:var(--fg-dim);width:30px;height:30px;cursor:pointer;}
.x-btn:hover{color:var(--fg);border-color:var(--fg);}
/* ─── FAB: フローティングボタン類 ─── */
.fab{
  position:fixed;right:20px;bottom:90px;width:56px;height:56px;border-radius:50%;
  background:var(--accent);color:#000;border:none;cursor:pointer;font-size:26px;
  display:grid;place-items:center;z-index:40;box-shadow:0 6px 24px rgba(255,59,48,0.35);
}
@media(min-width:768px){.fab{bottom:34px;right:34px;}}
.fab:active{transform:scale(.94);}
/* ─── RECORD VIEW: ストップウォッチ・記録リスト ─── */
.sw-display{font-family:var(--f-disp);font-size:64px;font-weight:500;letter-spacing:0.04em;text-align:center;padding:14px 0 6px;line-height:1;color:var(--fg-dim);}
@media(min-width:768px){.sw-display{font-size:84px;}}
.sw-state{text-align:center;color:var(--fg-dim);font-size:11px;letter-spacing:0.25em;text-transform:uppercase;margin-bottom:18px;}
.sw-state.live{color:var(--accent);}
.mode-toggle{display:flex;border:1px solid var(--line);margin-bottom:20px;}
.mode-toggle button{flex:1;background:none;border:none;color:var(--fg-dim);padding:12px;cursor:pointer;text-transform:uppercase;letter-spacing:0.14em;font-size:11px;}
.mode-toggle button.on{background:var(--fg);color:var(--on-fg);}
.rec-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line-soft);}
.rec-item:last-child{border-bottom:none;}
.rec-item .bar{width:3px;align-self:stretch;background:var(--fg-faint);}
.rec-item .meta{flex:1;min-width:0;}
.rec-item .meta .t{font-size:13px;}
.rec-item .meta .s{font-size:11px;color:var(--fg-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rec-item .dur{font-family:var(--f-disp);font-size:16px;color:var(--fg-dim);}
/* ─── GOALS VIEW: 目標カード・進捗バー ─── */
.goal-card{border:1px solid var(--line);padding:18px;margin-bottom:14px;position:relative;}
.goal-card .gc-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;}
.goal-card .gc-name{display:flex;align-items:center;gap:9px;font-size:15px;color:var(--fg-dim);}
.goal-card .gc-pct{font-family:var(--f-mono);font-size:30px;line-height:1;color:var(--fg-dim);font-weight:600;}
.progress{height:6px;background:var(--bg-2);border:1px solid var(--line-soft);overflow:hidden;}
.progress > i{display:block;height:100%;background:var(--accent);transition:width .5s ease;}
.goal-card .gc-meta{display:flex;justify-content:space-between;margin-top:12px;font-size:11px;color:var(--fg-dim);letter-spacing:0.05em;}
.goal-card .gc-edit{position:absolute;top:12px;right:12px;}
.goal-card .gc-type{font-size:10px;letter-spacing:0.1em;color:var(--fg-dim);border:1px solid var(--line);border-radius:999px;padding:2px 9px;}
/* ─── CALENDAR VIEW: カレンダーグリッド ─── */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
.cal-head .m{font-family:var(--f-disp);font-size:22px;letter-spacing:0.06em;}
.cal-nav{display:flex;gap:8px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
.cal-dow{text-align:center;font-size:10px;color:var(--fg-faint);text-transform:uppercase;letter-spacing:0.1em;padding-bottom:6px;}
.cal-cell{aspect-ratio:1;border:1px solid var(--line-soft);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;position:relative;}
.cal-cell.empty{border-color:transparent;cursor:default;}
.cal-cell.today{border-color:var(--accent);}
.cal-cell.sel{background:var(--bg-2);border-color:var(--fg);}
.cal-cell .d{font-family:var(--f-disp);font-size:14px;color:var(--fg-dim);}
.cal-cell.has .d{color:var(--fg);}
.cal-cell .dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;max-width:80%;}
.cal-cell .dots i{width:5px;height:5px;border-radius:50%;}
.day-detail{margin-top:18px;}
/* ─── REPORT VIEW: KPIカード ─── */
.kpi-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px;}
@media(min-width:520px){.kpi-row{grid-template-columns:repeat(4,1fr);}}
.kpi{border:1px solid var(--line);padding:16px;}
.kpi .k{font-size:11px;text-transform:uppercase;letter-spacing:0.16em;color:var(--fg-dim);font-weight:500;margin-bottom:10px;}
.kpi .v{font-family:var(--f-disp);font-size:24px;line-height:1;color:var(--fg-dim);font-weight:400;}
.kpi .v.pos{color:var(--accent);}
.kpi .v.neg{color:var(--fg-faint);}
.wk-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
.wk-nav .rng{font-family:var(--f-disp);font-size:15px;letter-spacing:0.04em;}
/* ─── REPORT CHART: 曜日別バーグラフ（案1〜4実装済み） ─── */
.bars{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:8px;position:relative;}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;}
.bars .b .col{width:100%;background:var(--bg-2);border:1px solid var(--line);position:relative;min-height:2px;transition:height .4s ease;overflow:hidden;}
.bars .b .col > i{position:absolute;bottom:0;left:0;right:0;}
.bars .b.peak .col{border-color:var(--accent);}
.bars .b.sel .col{border-color:var(--fg);border-width:2px;}
.bars .b.sel .lab{color:var(--fg);}
.bars .b .lab{font-size:10px;color:var(--fg-dim);}
/* 案2: 科目別セグメント */
.bars .b .col .seg{position:absolute;left:0;right:0;}
/* 案1: 縦書き時間ラベル */
.bar-overlay{position:absolute;bottom:0;left:0;right:0;background:transparent;display:flex;align-items:flex-start;justify-content:center;padding-top:4px;pointer-events:none;}
.bar-time{writing-mode:vertical-rl;text-orientation:upright;font-family:var(--f-mono);font-size:9px;letter-spacing:0.08em;white-space:nowrap;}
:root.theme-light .bar-time{color:rgba(0,0,0,0.5);}
/* 案3: 先週比較マーカー */
.bar-prev{position:absolute;left:0;right:0;height:0;border-top:2px dashed var(--fg-faint);pointer-events:none;z-index:3;}
/* 案4: 週平均ライン */
.avg-line{position:absolute;left:0;right:0;border-top:1px dashed var(--fg-dim);pointer-events:none;z-index:4;}
.avg-label{position:absolute;right:2px;top:-13px;font-family:var(--f-mono);font-size:8px;color:var(--fg-faint);letter-spacing:0.08em;}
/* チュートリアル */
/* ─── TUTORIAL: 初回チュートリアルモーダル ─── */
.t-step{display:flex;align-items:flex-start;gap:14px;padding:16px 0;border-bottom:1px solid var(--line);}
.t-step:last-of-type{border-bottom:none;}
.t-num{font-family:var(--f-mono);font-size:20px;font-weight:700;color:var(--accent);min-width:28px;line-height:1;}
.t-icon{font-size:22px;min-width:28px;line-height:1.2;}
.t-title{font-size:14px;font-weight:600;margin-bottom:6px;letter-spacing:0.02em;}
.t-desc{font-size:12px;color:var(--fg-dim);line-height:1.75;white-space:pre-line;}
.subj-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:12px;}
.subj-row .nm{width:84px;flex:0 0 84px;display:flex;align-items:center;gap:7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.subj-row .track{flex:1;height:8px;background:var(--bg-2);border:1px solid var(--line-soft);}
.subj-row .track > i{display:block;height:100%;}
.subj-row .val{font-family:var(--f-disp);width:64px;text-align:right;flex:0 0 64px;}
/* ─── MANAGE / MENU: メニューリスト・設定項目 ─── */
.menu-list{display:flex;flex-direction:column;}
.menu-list button{display:flex;align-items:center;justify-content:space-between;background:none;border:none;border-bottom:1px solid var(--line-soft);color:var(--fg);padding:15px 4px;cursor:pointer;text-align:left;}
.menu-list button:hover{color:var(--accent);}
.menu-list button .arr{color:var(--fg-faint);}
.list-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line-soft);}
.list-item .grow{flex:1;min-width:0;}
.list-item .sub{font-size:11px;color:var(--fg-dim);}
.swatch-pick{display:flex;gap:8px;flex-wrap:wrap;}
.swatch-pick button{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer;}
.swatch-pick button.on{border-color:var(--fg);}
/* ─── SETUP / AUTH: セットアップ・ログイン画面 ─── */
.setup{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center;}
.setup .big{font-family:var(--f-disp);font-size:46px;letter-spacing:0.1em;margin-bottom:8px;}
.setup .glyph-lg{width:18px;height:18px;border-radius:50%;background:var(--accent);box-shadow:0 0 24px var(--accent);margin-bottom:26px;}
.setup p{color:var(--fg-dim);margin-bottom:30px;letter-spacing:0.1em;font-size:12px;text-transform:uppercase;}
.setup .form{width:min(360px,100%);}
.auth-msg{min-height:18px;font-size:12px;color:var(--accent);letter-spacing:0.04em;margin:4px 0 14px;text-align:center;}

<body>
<div id="app"></div>
<div id="modal-root" class="modal-root"></div>
<script>
"use strict";

/* ============================================================
 *  studymanager — アーキテクチャ概要
 * ============================================================
 *  データフロー: UI操作 → Store.add/patch → commit()
 *               → writeRaw(localStorage) → onCommit()
 *               → Cloud.scheduleSync() → Firebase PUT
 *
 *  モジュール構成（定義順）:
 *    CONFIG   定数・Firebase設定・カラーパレット
 *    STORE    データCRUD + クラウド同期フック
 *    THEME    ダーク/ライト切替
 *    AUTH     Firebase Identity Toolkit REST（メール認証のみ）
 *    CLOUD    Firebase Realtime DB REST（pull/push/sync）
 *    UTIL     日付・時刻・IDなどユーティリティ関数
 *    STATE    タブ・選択状態などUIの一時状態
 *    DOM      el() / $ / $$ ヘルパー
 *    VIEWS    record / goals / calendar / report の各タブ
 *    MANAGE   メニュー・設定モーダル
 *    APP      起動・画面遷移・チュートリアル
 *
 *  カスタマイズしたい場合:
 *    科目色パレット → CONFIG.PALETTE
 *    Firebase設定  → CONFIG.firebase
 *    タブ構成      → CONFIG.TABS
 *    チュートリアル → App.showTutorial()
 * ============================================================ */

/* ---------------- [CONFIG] ---------------- */
const CONFIG = {
  KEY: 'studymanager.v1',
  /* ↓↓ Firebase設定 — ここに自分のプロジェクトの値を入れる ↓↓ */
  firebase: {
    apiKey:      'AIzaSyC-Iqs8Kwx9SYGEYsx_dpZdi5k7ao-xNG4',
    databaseURL: 'https://study-manage-528dd-default-rtdb.asia-southeast1.firebasedatabase.app',
  },
  AUTH_KEY: 'studymanager.auth.v1',
  CLOUD_KEYS: ['profile','settings','subjects','materials','locations','records','goals'],
  PALETTE: [
    '#ff3b30','#ff6b6b','#ff9d4b','#fb8500',
    '#ffc93c','#ffe066','#b5e853','#6be07a',
    '#43aa8b','#00c896','#4bc0ff','#00b4d8',
    '#4895ef','#4361ee','#9b5de5','#c77dff',
    '#ff6bd6','#f72585','#9aa0a8','#ffffff',
  ],
  TABS: [
    {id:'record',   idx:'01', label:'record'},
    {id:'goals',    idx:'02', label:'goals'},
    {id:'calendar', idx:'03', label:'calendar'},
    {id:'report',   idx:'04', label:'report'},
  ],
  MAX_WEEKS_BACK: 8,
  defaults(){
    return {
      profile:{ name:'' },
      session:{ active:false },
      settings:{ theme:'dark', navCollapsed:false },
      subjects:[],
      materials:[],
      locations:[],
      records:[],
      goals:[],
    };
  }
};

/* ---------------- [STORE] ---------------- */
const Store = (() => {
  let usingLS = false;
  let mem = null;
  try{
    const t='__sm_test__'; localStorage.setItem(t,'1'); localStorage.removeItem(t); usingLS=true;
  }catch(e){ usingLS=false; }

  function readRaw(){
    if(usingLS){ const s=localStorage.getItem(CONFIG.KEY); return s?JSON.parse(s):null; }
    return mem;
  }
  function writeRaw(data){
    if(usingLS){ localStorage.setItem(CONFIG.KEY, JSON.stringify(data)); }
    else { mem = data; }
  }

  let cache = readRaw();
  if(!cache){ cache = CONFIG.defaults(); writeRaw(cache); }

  let onCommit = null;
  function commit(){ writeRaw(cache); if(onCommit){ try{ onCommit(); }catch(e){} } }

  return {
    persistent: usingLS,
    all(){ return cache; },
    list(coll){ return cache[coll] || []; },
    find(coll,id){ return (cache[coll]||[]).find(x=>x.id===id) || null; },
    add(coll,obj){ cache[coll]=cache[coll]||[]; cache[coll].push(obj); commit(); return obj; },
    update(coll,id,patch){
      const it=this.find(coll,id); if(it){ Object.assign(it,patch); commit(); } return it;
    },
    remove(coll,id){ cache[coll]=(cache[coll]||[]).filter(x=>x.id!==id); commit(); },
    get(key){ return cache[key]; },
    set(key,val){ cache[key]=val; commit(); },
    patch(key,obj){ cache[key]=Object.assign({},cache[key],obj); commit(); },
    reset(){ cache=CONFIG.defaults(); commit(); },
    export(){ return JSON.parse(JSON.stringify(cache)); },
    setOnCommit(fn){ onCommit=fn; },
    cloudSnapshot(){ const o={}; CONFIG.CLOUD_KEYS.forEach(k=>{ o[k]=cache[k]; }); return o; },
    importCloud(data){
      if(!data || typeof data!=='object') return;
      CONFIG.CLOUD_KEYS.forEach(k=>{ if(data[k]!==undefined) cache[k]=data[k]; });
      writeRaw(cache);
    },
  };
})();

/* ---------------- [THEME] ---------------- */
const Theme = {
  list: [{k:'dark',label:'ダーク（黒基調）'},{k:'light',label:'ライト（白基調）'}],
  current(){ const s=Store.get('settings'); return (s&&s.theme)==='light'?'light':'dark'; },
  apply(name){ document.documentElement.classList.toggle('theme-light', name==='light'); },
  set(name){ Store.patch('settings',{theme:name}); this.apply(name); }
};

/* ---------------- [AUTH] ---------------- */
const Auth = {
  cfg(){ return CONFIG.firebase || {}; },
  enabled(){ const c=this.cfg(); return !!(c.apiKey && c.databaseURL); },
  session(){ try{ return JSON.parse(localStorage.getItem(CONFIG.AUTH_KEY)||'null'); }catch(e){ return null; } },
  save(s){ try{ localStorage.setItem(CONFIG.AUTH_KEY, JSON.stringify(s)); }catch(e){} },
  clear(){ try{ localStorage.removeItem(CONFIG.AUTH_KEY); }catch(e){} },
  loggedIn(){ const s=this.session(); return !!(s && s.refreshToken && s.uid); },
  email(){ const s=this.session(); return s? s.email : ''; },
  signUp(email,pw){ return this._auth('accounts:signUp', email, pw); },
  signIn(email,pw){ return this._auth('accounts:signInWithPassword', email, pw); },
  async _auth(method, email, pw){
    const res = await fetch(`https://identitytoolkit.googleapis.com/v1/${method}?key=${encodeURIComponent(this.cfg().apiKey)}`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ email, password: pw, returnSecureToken: true })
    });
    const d = await res.json();
    if(!res.ok) throw new Error(this._msg(d));
    const s = { uid:d.localId, email:d.email||email, idToken:d.idToken, refreshToken:d.refreshToken,
                expiresAt: Date.now() + (parseInt(d.expiresIn||'3600',10) * 1000) };
    this.save(s); return s;
  },
  async validToken(){
    const s = this.session();
    if(!s) throw new Error('未ログインです');
    if(Date.now() < (s.expiresAt - 60000)) return s.idToken;
    const res = await fetch(`https://securetoken.googleapis.com/v1/token?key=${encodeURIComponent(this.cfg().apiKey)}`, {
      method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body: `grant_type=refresh_token&refresh_token=${encodeURIComponent(s.refreshToken)}`
    });
    const d = await res.json();
    if(!res.ok) throw new Error(this._msg(d));
    s.idToken=d.id_token; s.refreshToken=d.refresh_token; s.uid=d.user_id||s.uid;
    s.expiresAt = Date.now() + (parseInt(d.expires_in||'3600',10) * 1000);
    this.save(s); return s.idToken;
  },
  _msg(d){
    const code=(d && d.error && d.error.message) || 'ERROR';
    const map={ EMAIL_EXISTS:'このメールアドレスは既に登録されています', EMAIL_NOT_FOUND:'登録されていないメールアドレスです',
      INVALID_PASSWORD:'パスワードが正しくありません', INVALID_LOGIN_CREDENTIALS:'メールまたはパスワードが正しくありません',
      WEAK_PASSWORD:'パスワードは6文字以上にしてください', 'WEAK_PASSWORD : Password should be at least 6 characters':'パスワードは6文字以上にしてください',
      INVALID_EMAIL:'メールアドレスの形式が正しくありません', MISSING_PASSWORD:'パスワードを入力してください',
      MISSING_EMAIL:'メールアドレスを入力してください', USER_DISABLED:'このアカウントは無効化されています',
      TOO_MANY_ATTEMPTS_TRY_LATER:'試行回数が多すぎます。しばらく待ってから再度お試しください',
      TOKEN_EXPIRED:'セッションの有効期限が切れました。再度ログインしてください' };
    return map[code] || ('認証エラー: ' + code);
  }
};

/* ---------------- [CLOUD] ---------------- */
const Cloud = {
  status:'idle',
  _timer:null,
  _url(uid, token){ return `${Auth.cfg().databaseURL.replace(/\/+$/,'')}/users/${uid}.json?auth=${encodeURIComponent(token)}`; },
  async pull(){
    const s=Auth.session(); const token=await Auth.validToken();
    const res=await fetch(this._url(s.uid, token));
    if(!res.ok) throw new Error('クラウド読込失敗 ('+res.status+')');
    return await res.json();
  },
  async push(){
    const s=Auth.session(); const token=await Auth.validToken();
    const res=await fetch(this._url(s.uid, token), {
      method:'PUT', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(Store.cloudSnapshot())
    });
    if(!res.ok) throw new Error('クラウド書込失敗 ('+res.status+')');
  },
  async initialSync(){
    if(!Auth.enabled() || !Auth.loggedIn()) return;
    this._set('syncing');
    try{
      const data = await this.pull();
      if(data && typeof data==='object' && Object.keys(data).length){ Store.importCloud(data); }
      else { await this.push(); }
      this._set('synced');
    }catch(e){ this._set('offline'); throw e; }
  },
  scheduleSync(){
    if(!Auth.enabled() || !Auth.loggedIn()) return;
    this._set('syncing');
    clearTimeout(this._timer);
    this._timer = setTimeout(async ()=>{
      try{ await this.push(); this._set('synced'); }
      catch(e){ this._set('offline'); }
    }, 1500);
  },
  _set(st){ this.status=st; if(typeof App!=='undefined' && App.updateSyncBadge) App.updateSyncBadge(); }
};

Store.setOnCommit(()=>Cloud.scheduleSync());

/* ---------------- [UTIL] ---------------- */
const U = {
  uid(){ return (crypto.randomUUID? crypto.randomUUID() : 'id'+Date.now()+Math.random().toString(16).slice(2)); },
  pad(n){ return String(n).padStart(2,'0'); },
  dur(sec){ sec=Math.round(sec); const h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60);
    if(h&&m) return h+'h '+m+'m'; if(h) return h+'h'; return m+'m'; },
  clock(sec){ sec=Math.floor(sec); const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;
    return U.pad(h)+':'+U.pad(m)+':'+U.pad(s); },
  hours(sec){ return sec/3600; },
  ymd(d){ d=new Date(d); return d.getFullYear()+'-'+U.pad(d.getMonth()+1)+'-'+U.pad(d.getDate()); },
  sameDay(a,b){ if(!a||!b) return false; a=new Date(a); b=new Date(b); if(isNaN(a)||isNaN(b)) return false;
    return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate(); },
  weekStart(d){ const x=new Date(d); x.setHours(0,0,0,0); const wd=(x.getDay()+6)%7; x.setDate(x.getDate()-wd); return x; },
  addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; },
  fmtDate(d){ return (d.getMonth()+1)+'/'+d.getDate(); },
  localInput(d){ return d.getFullYear()+'-'+U.pad(d.getMonth()+1)+'-'+U.pad(d.getDate())+'T'+U.pad(d.getHours())+':'+U.pad(d.getMinutes()); },
  daysLeft(deadlineStr){ if(!deadlineStr) return null; const t=new Date(deadlineStr+'T23:59:59'); return Math.ceil((t-new Date())/86400000); },
  subj(id){ return Store.find('subjects',id) || {id,name:'(削除済)',color:'#555'}; },
  mat(id){ return id? Store.find('materials',id):null; },
  loc(id){ return id? Store.find('locations',id):null; },
};

/* ---------------- [STATE] ---------------- */
const State = {
  tab:'record',
  recordMode:'stopwatch',
  sel:{subjectId:null, materialId:null, locationId:null},
  timer:{ running:false, startTs:null, elapsedSec:0 },
  calMonth:new Date(),
  calSel:null,
  weekIndex:0,
  reportOpen:false,
  reportDay:null,   // 曜日別グラフでタップされた曜日インデックス（null=週全体）
};

/* ---------------- [DOM helpers] ---------------- */
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>Array.from(r.querySelectorAll(s));
function el(tag, attrs={}, children=[]){
  const n=document.createElement(tag);
  for(const k in attrs){
    if(k==='class') n.className=attrs[k];
    else if(k==='html') n.innerHTML=attrs[k];
    else if(k==='text') n.textContent=attrs[k];
    else if(k.startsWith('on') && typeof attrs[k]==='function') n.addEventListener(k.slice(2),attrs[k]);
    else if(attrs[k]!=null) n.setAttribute(k,attrs[k]);
  }
  (Array.isArray(children)?children:[children]).forEach(c=>{ if(c==null)return; n.append(c.nodeType?c:document.createTextNode(c)); });
  return n;
}
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------------- [COMPONENTS] ---------------- */
const Modal = {
  open({title, body, footer}){
    const root=$('#modal-root');
    root.innerHTML='';
    const close=()=>Modal.close();
    const box=el('div',{class:'modal fade'},[
      el('div',{class:'modal-head'},[ el('h2',{text:title||''}), el('button',{class:'x-btn',text:'✕',onclick:close}) ]),
      el('div',{class:'modal-body'}, body||[]),
    ]);
    if(footer) box.append(el('div',{class:'modal-foot'}, footer));
    root.append(el('div',{class:'modal-bg',onclick:close}), box);
    root.classList.add('open');
    return box;
  },
  close(){ const root=$('#modal-root'); root.classList.remove('open'); root.innerHTML=''; }
};

function confirmDialog(msg, onYes, yesLabel='削除', danger=true){
  Modal.open({
    title:'確認',
    body:[ el('p',{text:msg, style:'color:var(--fg-dim);line-height:1.7;'}) ],
    footer:[
      el('button',{class:'btn btn-ghost',text:'キャンセル',onclick:Modal.close}),
      el('button',{class:'btn '+(danger?'btn-danger':'btn-primary'),text:yesLabel,onclick:()=>{Modal.close();onYes();}}),
    ]
  });
}

function chipRow(items, isOn, onPick, render){
  const row=el('div',{class:'chip-row'});
  items.forEach(it=>{
    const c=el('button',{class:'chip'+(isOn(it)?' on':''),onclick:()=>onPick(it)});
    render(c,it);
    row.append(c);
  });
  return row;
}

/* ---------------- [VIEWS] ---------------- */
const Views = {};

Views.record = {
  mount(root){
    const wrap=el('div',{class:'fade'});
    wrap.append(viewHead('record','/ track time','記録 — RECORD STUDY TIME'));
    const toggle=el('div',{class:'mode-toggle'},[
      el('button',{class:State.recordMode==='stopwatch'?'on':'',text:'stopwatch',onclick:()=>{State.recordMode='stopwatch';App.renderMain();}}),
      el('button',{class:State.recordMode==='manual'?'on':'',text:'manual',onclick:()=>{State.recordMode='manual';App.renderMain();}}),
    ]);
    wrap.append(toggle);
    wrap.append(State.recordMode==='stopwatch' ? this.stopwatch() : this.manual());
    wrap.append(this.recent());
    root.append(wrap);
  },
  selectors(){
    const subjects=Store.list('subjects');
    const sub=el('div',{class:'field'},[ el('label',{text:'科目 SUBJECT'}) ]);
    sub.append(chipRow(subjects, s=>State.sel.subjectId===s.id, s=>{
      State.sel.subjectId=s.id; State.sel.materialId=null; App.renderMain();
    }, (c,s)=>{ c.append(el('i',{class:'swatch',style:`background:${s.color}`}), document.createTextNode(s.name)); }));
    const mats=Store.list('materials').filter(m=>m.subjectId===State.sel.subjectId);
    const mat=el('div',{class:'field'},[ el('label',{text:'教材 MATERIAL'}) ]);
    if(!State.sel.subjectId) mat.append(el('div',{class:'sub',style:'color:var(--fg-faint);font-size:12px;',text:'科目を選択してください'}));
    else if(!mats.length) mat.append(el('div',{class:'sub',style:'color:var(--fg-faint);font-size:12px;',text:'この科目の教材は未登録'}));
    else mat.append(chipRow(mats, m=>State.sel.materialId===m.id, m=>{ State.sel.materialId=(State.sel.materialId===m.id?null:m.id); App.renderMain(); }, (c,m)=>{ c.textContent=m.name; }));
    const locs=Store.list('locations');
    const loc=el('div',{class:'field'},[ el('label',{text:'場所 PLACE'}) ]);
    loc.append(chipRow(locs, l=>State.sel.locationId===l.id, l=>{ State.sel.locationId=(State.sel.locationId===l.id?null:l.id); App.renderMain(); }, (c,l)=>{ c.textContent=(l.emoji?l.emoji+' ':'')+l.name; }));
    return [sub,mat,loc];
  },
  stopwatch(){
    const p=el('div',{class:'panel'});
    p.append(el('div',{class:'sect-title',text:'STOPWATCH'}));
    const t=State.timer;
    const shown = t.elapsedSec + (t.running? (Date.now()-t.startTs)/1000 : 0);
    p.append(el('div',{class:'sw-display',id:'sw-display',text:U.clock(shown)}));
    p.append(el('div',{class:'sw-state'+(t.running?' live':''),text: t.running?'● RECORDING':(t.elapsedSec>0?'PAUSED':'READY')}));
    this.selectors().forEach(n=>p.append(n));
    const btns=el('div',{class:'row',style:'margin-top:8px;'});
    if(!t.running){
      btns.append(el('button',{class:'btn btn-accent btn-lg',text:t.elapsedSec>0?'再開 RESUME':'開始 START',onclick:()=>this.start()}));
      if(t.elapsedSec>0){
        btns.append(el('button',{class:'btn btn-primary btn-lg',text:'保存 SAVE',onclick:()=>this.save()}));
        btns.append(el('button',{class:'btn btn-lg',text:'破棄',onclick:()=>this.discard()}));
      }
    }else{
      btns.append(el('button',{class:'btn btn-lg',text:'停止 STOP',onclick:()=>this.stop()}));
    }
    p.append(btns);
    return p;
  },
  start(){ const t=State.timer; t.running=true; t.startTs=Date.now(); App.renderMain(); },
  stop(){ const t=State.timer; if(t.running){ t.elapsedSec+=(Date.now()-t.startTs)/1000; t.running=false; t.startTs=null; } App.renderMain(); },
  discard(){ State.timer={running:false,startTs:null,elapsedSec:0}; App.renderMain(); },
  save(){
    if(!State.sel.subjectId){ toast('科目を選択してください'); return; }
    const t=State.timer; const dur=Math.round(t.elapsedSec);
    if(dur<1){ toast('記録時間がありません'); return; }
    const start=new Date(Date.now()-dur*1000);
    Store.add('records',{ id:U.uid(), subjectId:State.sel.subjectId, materialId:State.sel.materialId,
      locationId:State.sel.locationId, start:start.toISOString(), durationSec:dur, note:'', createdAt:new Date().toISOString() });
    State.timer={running:false,startTs:null,elapsedSec:0};
    toast('記録を保存しました'); App.renderMain();
  },
  manual(){
    const p=el('div',{class:'panel'});
    p.append(el('div',{class:'sect-title',text:'MANUAL ENTRY'}));
    this.selectors().forEach(n=>p.append(n));
    const dt=el('input',{class:'input',type:'datetime-local',value:U.localInput(new Date())});
    const hrs=el('input',{class:'input',type:'number',min:'0',max:'23',placeholder:'0',value:'0'});
    const min=el('input',{class:'input',type:'number',min:'0',max:'59',placeholder:'0',value:'30'});
    const note=el('textarea',{class:'textarea',placeholder:'メモ（任意）'});
    p.append(el('div',{class:'field'},[ el('label',{text:'日時 DATE / TIME'}), dt ]));
    p.append(el('div',{class:'row'},[
      el('div',{class:'field'},[ el('label',{text:'時間 HOURS'}), hrs ]),
      el('div',{class:'field'},[ el('label',{text:'分 MINUTES'}), min ]),
    ]));
    p.append(el('div',{class:'field'},[ el('label',{text:'メモ NOTE'}), note ]));
    p.append(el('button',{class:'btn btn-primary btn-block btn-lg',text:'保存 SAVE',onclick:()=>{
      if(!State.sel.subjectId){ toast('科目を選択してください'); return; }
      const h=parseInt(hrs.value,10)||0;
      const m=parseInt(min.value,10)||0;
      if(h<0||m<0||m>59){ toast('時間・分の値が正しくありません'); return; }
      if(h===0&&m===0){ toast('時間または分を入力してください'); return; }
      if(!dt.value){ toast('日時を入力してください'); return; }
      Store.add('records',{ id:U.uid(), subjectId:State.sel.subjectId, materialId:State.sel.materialId,
        locationId:State.sel.locationId, start:new Date(dt.value).toISOString(), durationSec:h*3600+m*60,
        note:note.value.trim(), createdAt:new Date().toISOString() });
      toast('記録を保存しました'); App.renderMain();
    }}));
    return p;
  },
  recent(){
    const p=el('div',{class:'panel'});
    p.append(el('div',{class:'sect-title',text:'RECENT — 直近の記録'}));
    const recs=[...Store.list('records')].sort((a,b)=>new Date(b.start)-new Date(a.start)).slice(0,5);
    if(!recs.length){ p.append(el('div',{class:'empty',text:'まだ記録がありません'})); return p; }
    recs.forEach(r=>p.append(recItem(r,true)));
    return p;
  }
};

function recItem(r, deletable){
  const s=U.subj(r.subjectId), m=U.mat(r.materialId), l=U.loc(r.locationId);
  const sub=[m?m.name:null, l?(l.emoji+' '+l.name):null, U.fmtDate(new Date(r.start))].filter(Boolean).join('  ·  ');
  const node=el('div',{class:'rec-item'},[
    el('div',{class:'bar',style:`background:${s.color}`}),
    el('div',{class:'meta'},[ el('div',{class:'t',text:s.name}), el('div',{class:'s',text:sub}) ]),
    el('div',{class:'dur',text:U.dur(r.durationSec)}),
  ]);
  if(deletable){
    node.append(el('button',{class:'btn-ghost',style:'padding:6px 8px;',text:'✕',title:'削除',onclick:()=>{
      confirmDialog('この記録を削除しますか？',()=>{Store.remove('records',r.id);App.renderMain();});
    }}));
  }
  return node;
}

Views.goals = {
  studied(subjectId){
    return Store.list('records').filter(r=>r.subjectId===subjectId).reduce((a,r)=>a+r.durationSec,0);
  },
  progressOf(g){
    const type=g.type||'time';
    if(type==='progress'){
      const unit=g.unit||'';
      const done=Number(g.currentCount)||0, target=Number(g.targetCount)||0;
      const pct=target>0?Math.min(100,Math.round(done/target*100)):0;
      return { type, pct, doneText:`${done}${unit}`, targetText:`${target}${unit}`,
               remainText:`残り ${Math.max(0,target-done)}${unit}` };
    }
    const doneSec=this.studied(g.subjectId), targetSec=(Number(g.targetHours)||0)*3600;
    const pct=targetSec>0?Math.min(100,Math.round(doneSec/targetSec*100)):0;
    return { type, pct, doneText:U.dur(doneSec), targetText:`${Number(g.targetHours)||0}h`,
             remainText:`残り ${U.dur(Math.max(0,targetSec-doneSec))}` };
  },
  mount(root){
    const wrap=el('div',{class:'fade'});
    wrap.append(viewHead('goals','/ targets','目標 — SET & TRACK GOALS'));
    const goals=Store.list('goals');
    if(!goals.length){ wrap.append(el('div',{class:'panel'},[el('div',{class:'empty',text:'目標がありません。右下の + から追加してください'})])); }
    goals.forEach(g=>{
      const s=U.subj(g.subjectId);
      const p=this.progressOf(g);
      const dl=U.daysLeft(g.deadline);
      const card=el('div',{class:'goal-card'});
      card.append(el('button',{class:'btn-ghost gc-edit',text:'編集',onclick:()=>this.form(g)}));
      card.append(el('div',{class:'gc-top'},[
        el('div',{class:'gc-name'},[
          el('i',{class:'swatch',style:`width:11px;height:11px;border-radius:50%;background:${s.color}`}),
          document.createTextNode(s.name),
          el('span',{class:'gc-type',text: p.type==='progress'?'進度':'時間'}),
        ]),
      ]));
      card.append(el('div',{style:'display:flex;align-items:flex-end;gap:6px;margin-bottom:12px;'},[
        el('div',{class:'gc-pct',text:p.pct+'%'}),
      ]));
      const bar=el('div',{class:'progress'}); bar.append(el('i',{style:`width:${p.pct}%`})); card.append(bar);
      card.append(el('div',{class:'gc-meta'},[
        el('span',{text:`${p.doneText} / ${p.targetText}`}),
        el('span',{text:p.remainText}),
        el('span',{text: g.deadline? (dl>=0?`締切まで ${dl}日`:`期限超過 ${-dl}日`) : '締切なし'}),
      ]));

        card.append(el('button',{class:'btn btn-ghost',text:'＋ 進捗を更新',style:'margin-top:12px;width:100%;',onclick:()=>this.updateProgress(g)}));
      }
      wrap.append(card);
    });
    root.append(wrap);
  },
  updateProgress(goal){
    const unit=goal.unit||'';
    const cur=el('input',{class:'input',type:'number',min:'0',value:Number(goal.currentCount)||0});
    Modal.open({
      title:'進捗を更新',
      body:[
        el('p',{text:`${U.subj(goal.subjectId).name} ／ 目標 ${Number(goal.targetCount)||0}${unit}`,style:'color:var(--fg-dim);margin-bottom:10px;'}),
        el('div',{class:'field'},[el('label',{text:`現在の進捗 CURRENT（${unit}）`}),cur]),
      ],
      footer:[
        el('button',{class:'btn btn-ghost',text:'キャンセル',onclick:Modal.close}),
        el('button',{class:'btn btn-primary',text:'保存',onclick:()=>{
          const v=parseFloat(cur.value);
          if(isNaN(v)||v<0){toast('0以上の数値を入力してください');return;}
          Store.update('goals',goal.id,{currentCount:v});
          Modal.close(); App.renderMain();
        }}),
      ]
    });
  },
  form(goal){
    const editing=!!goal;
    const subjects=Store.list('subjects');
    let pickSubj = goal? goal.subjectId : (subjects[0]&&subjects[0].id);
    let pickType = goal? (goal.type||'time') : 'time';
    const subjWrap=el('div',{class:'field'},[el('label',{text:'科目 SUBJECT'})]);
    const renderSubj=()=>{ const old=subjWrap.querySelector('.chip-row'); if(old)old.remove();
      subjWrap.append(chipRow(subjects,s=>pickSubj===s.id,s=>{pickSubj=s.id;renderSubj();},(c,s)=>{c.append(el('i',{class:'swatch',style:`background:${s.color}`}),document.createTextNode(s.name));})); };
    renderSubj();
    const hours  =el('input',{class:'input',type:'number',min:'0.5',step:'0.5',value:(goal&&goal.targetHours)||'20'});
    const count  =el('input',{class:'input',type:'number',min:'1',value:(goal&&goal.targetCount)||'50'});
    const unit   =el('input',{class:'input',type:'text',maxlength:'8',value:(goal&&goal.unit)||'ページ'});
    const current=el('input',{class:'input',type:'number',min:'0',value:(goal&&goal.currentCount)||'0'});
    const fields=el('div');
    const renderFields=()=>{ fields.innerHTML='';
      if(pickType==='progress'){
        fields.append(
          el('div',{class:'field'},[el('label',{text:'目標量 TARGET'}),count]),
          el('div',{class:'field'},[el('label',{text:'単位 UNIT（ページ等）'}),unit]),
          el('div',{class:'field'},[el('label',{text:'現在の進捗 CURRENT'}),current]),
        );
      }else{
        fields.append( el('div',{class:'field'},[el('label',{text:'目標時間（h）TARGET HOURS'}),hours]) );
      }
    };
    const typeWrap=el('div',{class:'field'},[el('label',{text:'目標タイプ GOAL TYPE'})]);
    const types=[{k:'time',label:'時間'},{k:'progress',label:'進度（ページ等）'}];
    const renderType=()=>{ const old=typeWrap.querySelector('.chip-row'); if(old)old.remove();
      typeWrap.append(chipRow(types,t=>pickType===t.k,t=>{pickType=t.k;renderType();renderFields();},(c,t)=>{c.append(document.createTextNode(t.label));})); };
    renderType(); renderFields();
    const dl=el('input',{class:'input',type:'date',value:goal?goal.deadline||'':''});
    Modal.open({
      title: editing?'目標を編集':'目標を追加',
      body:[ subjWrap, typeWrap, fields,
        el('div',{class:'field'},[el('label',{text:'締切日 DEADLINE（任意）'}),dl]),
      ],
      footer:[
        editing? el('button',{class:'btn btn-danger',text:'削除',onclick:()=>{confirmDialog('この目標を削除しますか？',()=>{Store.remove('goals',goal.id);Modal.close();App.renderMain();});}}) : null,
        el('button',{class:'btn btn-ghost',text:'キャンセル',onclick:Modal.close}),
        el('button',{class:'btn btn-primary',text:'保存',onclick:()=>{
          if(!pickSubj){toast('科目を選択してください');return;}
          let patch;
          if(pickType==='progress'){
            const c=parseFloat(count.value), u=unit.value.trim()||'ページ', cur=parseFloat(current.value);
            if(!c||c<=0){toast('目標量を入力してください');return;}
            patch={subjectId:pickSubj,type:'progress',targetCount:c,unit:u,currentCount:(isNaN(cur)||cur<0)?0:cur,deadline:dl.value||null};
          }else{
            const h=parseFloat(hours.value);
            if(!h||h<=0){toast('目標時間を入力してください');return;}
            patch={subjectId:pickSubj,type:'time',targetHours:h,deadline:dl.value||null};
          }
          if(editing) Store.update('goals',goal.id,patch);
          else Store.add('goals',Object.assign({id:U.uid(),createdAt:new Date().toISOString()},patch));
          Modal.close(); App.renderMain();
        }}),
      ].filter(Boolean)
    });
  }
};

  },
  mount(root){

Views.report = {
  weekTotal(start){
    const end=U.addDays(start,7);
    return Store.list('records').filter(r=>{const t=new Date(r.start);return t>=start&&t<end;});
  },
  mount(root){
    const wrap=el('div',{class:'fade'});
    wrap.append(viewHead('report','/ weekly','週次レポート — WEEKLY REVIEW'));
    const base=U.weekStart(new Date());
    const start=U.addDays(base,-7*State.weekIndex);
    const end=U.addDays(start,6);
    const recs=this.weekTotal(start);
    const prevRecs=this.weekTotal(U.addDays(start,-7));
    const total=recs.reduce((a,r)=>a+r.durationSec,0);
    const prevTotal=prevRecs.reduce((a,r)=>a+r.durationSec,0);
    const diff=total-prevTotal;
    wrap.append(el('div',{class:'wk-nav'},[
      el('button',{class:'btn btn-ghost',text:'‹ 前の週',disabled:State.weekIndex>=CONFIG.MAX_WEEKS_BACK?'':null,onclick:()=>{if(State.weekIndex<CONFIG.MAX_WEEKS_BACK){State.weekIndex++;State.reportDay=null;App.renderMain();}}}),
      el('div',{class:'rng',text:`${U.fmtDate(start)} – ${U.fmtDate(end)}${State.weekIndex===0?' (今週)':''}`}),
      el('button',{class:'btn btn-ghost',text:'次の週 ›',disabled:State.weekIndex<=0?'':null,onclick:()=>{if(State.weekIndex>0){State.weekIndex--;State.reportDay=null;App.renderMain();}}}),
    ]));
    const avgSec=total/7;
    wrap.append(el('div',{class:'kpi-row'},[
      kpi('この週の合計', U.dur(total)),
      kpi('前の週の合計', U.dur(prevTotal)),
      kpi('前週比', (diff>=0?'+':'−')+U.dur(Math.abs(diff)), diff>0?'pos':(diff<0?'neg':'')),
      kpi('1日平均', U.dur(avgSec)),
    ]));
    // 曜日別バー（改良版: 案1〜4）
    // 案2: 科目別内訳を計算
    const dayBreakdown=Array.from({length:7},()=>[]);
    recs.forEach(r=>{
      const idx=(new Date(r.start).getDay()+6)%7;
      const ex=dayBreakdown[idx].find(x=>x.subjectId===r.subjectId);
      if(ex) ex.secs+=r.durationSec;
      else dayBreakdown[idx].push({subjectId:r.subjectId,secs:r.durationSec});
    });
    const dayTotals=dayBreakdown.map(d=>d.reduce((a,x)=>a+x.secs,0));
    // 案3: 先週の日別合計
    const prevDayTotals=[0,0,0,0,0,0,0];
    prevRecs.forEach(r=>{ const idx=(new Date(r.start).getDay()+6)%7; prevDayTotals[idx]+=r.durationSec; });
    // スケール（今週・先週の最大値で統一）
    const maxSec=Math.max(1,...dayTotals,...prevDayTotals);
    const peakDay=dayTotals.indexOf(Math.max(...dayTotals));
    const bars=el('div',{class:'bars'});
    const dayNames=['月','火','水','木','金','土','日'];
    ['月','火','水','木','金','土','日'].forEach((lab,i)=>{
      const h=Math.round(dayTotals[i]/maxSec*100);
      const isSel=State.reportDay===i;
      const b=el('div',{class:'b'+(i===peakDay&&dayTotals[i]>0?' peak':'')+(isSel?' sel':''),
        style:'cursor:pointer;',onclick:()=>{ State.reportDay=(State.reportDay===i?null:i); App.renderMain(); }});
      const col=el('div',{class:'col',style:'height:100%;'});
      // 案2: 科目別カラーセグメントを下から積み上げ
      const segs=[...dayBreakdown[i]].sort((a,bb)=>a.secs-bb.secs);
      let cumPct=0;
      segs.forEach(seg=>{
        const segPct=Math.round(seg.secs/maxSec*100);
        const subj=U.subj(seg.subjectId);
        col.append(el('i',{class:'seg',style:`height:${segPct}%;bottom:${cumPct}%;background:${subj.color};`}));
        cumPct+=segPct;
      });
      // 案1: バー内に縦書きで合計時間（15%以上のみ・色は背景に合わせて自動）
      if(h>=15&&dayTotals[i]>0){
        const topSeg=segs.length?segs[segs.length-1]:null;
        const topColor=topSeg?U.subj(topSeg.subjectId).color:'';
        const bright=topColor?isLightColor(topColor):false;
        const txtColor=bright?'rgba(0,0,0,0.75)':'rgba(255,255,255,0.85)';
        const ov=el('i',{class:'bar-overlay',style:`height:${h}%`});
        ov.append(el('span',{class:'bar-time',style:`color:${txtColor}`,text:U.dur(dayTotals[i])}));
        col.append(ov);
      }
      // 案3: 先週比較の点線マーカー
      const prevH=Math.round(prevDayTotals[i]/maxSec*100);
      if(prevDayTotals[i]>0){
        col.append(el('span',{class:'bar-prev',style:`bottom:${prevH}%`}));
      }
      b.append(col,el('div',{class:'lab',text:lab}));
      bars.append(b);
    });
    // 案4: 週平均ライン（.bars横断、avgSecは上部で定義済み）
    if(avgSec>0){
      const avgBot=Math.round(22+(avgSec/maxSec)*128);
      const al=el('div',{class:'avg-line',style:`bottom:${avgBot}px`});
      al.append(el('span',{class:'avg-label',text:'avg'}));
      bars.append(al);
    }
    const bp=el('div',{class:'panel'}); bp.append(el('div',{class:'sect-title',text:'DAILY — 曜日別'}), bars); wrap.append(bp);
    // BY SUBJECT: 曜日タップ時はその日の記録だけ表示
    const selDay=State.reportDay;
    const subjRecs=selDay!==null ? recs.filter(r=>(new Date(r.start).getDay()+6)%7===selDay) : recs;
    const subjTotal=subjRecs.reduce((a,r)=>a+r.durationSec,0);
    const bySubj={};
    subjRecs.forEach(r=>{ bySubj[r.subjectId]=(bySubj[r.subjectId]||0)+r.durationSec; });
    const subjTitle='BY SUBJECT — 科目別'+(selDay!==null?` (${dayNames[selDay]})  ${U.dur(subjTotal)}`:'');
    const sp=el('div',{class:'panel'}); sp.append(el('div',{class:'sect-title',text:subjTitle}));
    const entries=Object.entries(bySubj).sort((a,b)=>b[1]-a[1]);
    if(!entries.length) sp.append(el('div',{class:'empty',text:selDay!==null?'この日は記録がありません':'この週は記録がありません'}));
    entries.forEach(([id,sec])=>{
      const s=U.subj(id); const ratio=subjTotal>0?Math.round(sec/subjTotal*100):0;
      sp.append(el('div',{class:'subj-row'},[
        el('div',{class:'nm'},[ el('i',{class:'swatch',style:`width:9px;height:9px;border-radius:50%;background:${s.color}`}), document.createTextNode(s.name) ]),
        (()=>{const t=el('div',{class:'track'});t.append(el('i',{style:`width:${ratio}%;background:${s.color}`}));return t;})(),
        el('div',{class:'val',text:U.dur(sec)}),
      ]));
    });
    wrap.append(sp);
    const lp=el('div',{class:'panel'});
    lp.append(el('button',{class:'btn btn-block',text:(State.reportOpen?'▲ 閉じる':'▼ この週の記録')+` (${recs.length})`,onclick:()=>{State.reportOpen=!State.reportOpen;App.renderMain();}}));
    if(State.reportOpen){
      const list=el('div',{style:'margin-top:14px;'});
      if(!recs.length) list.append(el('div',{class:'empty',text:'記録なし'}));
      else [...recs].sort((a,b)=>new Date(b.start)-new Date(a.start)).forEach(r=>list.append(recItem(r,false)));
      lp.append(list);
    }
    wrap.append(lp);
    root.append(wrap);
  }
};

function kpi(k,v,mod){ return el('div',{class:'kpi'},[ el('div',{class:'k',text:k}), el('div',{class:'v'+(mod?' '+mod:''),text:v}) ]); }

/* 背景色が明るいかどうかを判定（バー内テキストの色選択に使用） */
function isLightColor(hex){
  const c=hex.replace('#',''); if(c.length!==6) return false;
  const r=parseInt(c.slice(0,2),16),g=parseInt(c.slice(2,4),16),b=parseInt(c.slice(4,6),16);
  return (r*299+g*587+b*114)/1000 > 160;
}

      Theme.list.forEach(t=>list.append(el('button',{onclick:()=>{ Theme.set(t.k); render(); }},[
        el('span',{text:t.label}),
        el('span',{class:'arr',style:cur===t.k?'color:var(--accent);':'',text: cur===t.k?'✓':''}),
      ])));
      Modal.open({
        title:'テーマ',
        body:[
          el('p',{text:'アプリ全体の配色を切り替えます。選ぶとすぐ反映され、設定は保存されます。',style:'color:var(--fg-dim);font-size:13px;line-height:1.7;margin-bottom:12px;'}),
          list,
          el('button',{class:'btn btn-ghost',style:'margin-top:14px;',text:'‹ メニューに戻る',onclick:()=>this.open()}),
        ]
      });
    };
    render();
  },
  subjects(){
    const body=el('div',{});
    const reload=()=>{ body.innerHTML='';
      Store.list('subjects').forEach(s=>{
        body.append(el('div',{class:'list-item'},[
          el('i',{class:'swatch',style:`width:14px;height:14px;border-radius:50%;background:${s.color}`}),
          el('div',{class:'grow',text:s.name}),
          el('button',{class:'btn-ghost',text:'編集',onclick:()=>this.subjectForm(s,reload)}),
          el('button',{class:'btn-ghost',text:'✕',onclick:()=>confirmDialog(`「${s.name}」を削除しますか？\n（紐づく教材も削除されます。既存の記録は残ります）`,()=>{
            Store.list('materials').filter(m=>m.subjectId===s.id).forEach(m=>Store.remove('materials',m.id));
            Store.remove('subjects',s.id); reload(); App.renderMain();
          })}),
        ]));
      });
      body.append(el('button',{class:'btn btn-block',style:'margin-top:14px;',text:'+ 科目を追加',onclick:()=>this.subjectForm(null,reload)}));
    };
    reload();
    Modal.open({title:'科目を管理',body:[body]});
  },
  subjectForm(s,after){
    const editing=!!s; let color=s?s.color:CONFIG.PALETTE[0];
    const name=el('input',{class:'input',value:s?s.name:'',placeholder:'例: 英語'});
    const pick=el('div',{class:'swatch-pick'});
    const renderPick=()=>{ pick.innerHTML=''; CONFIG.PALETTE.forEach(c=>pick.append(el('button',{class:color===c?'on':'',style:`background:${c}`,onclick:()=>{color=c;renderPick();}}))); };
    renderPick();
    Modal.open({title:editing?'科目を編集':'科目を追加',
      body:[ el('div',{class:'field'},[el('label',{text:'名前 NAME'}),name]), el('div',{class:'field'},[el('label',{text:'カラー COLOR'}),pick]) ],
      footer:[
        el('button',{class:'btn btn-ghost',text:'戻る',onclick:()=>this.subjects()}),
        el('button',{class:'btn btn-primary',text:'保存',onclick:()=>{
          if(!name.value.trim()){toast('名前を入力してください');return;}
          if(editing) Store.update('subjects',s.id,{name:name.value.trim(),color});
          else Store.add('subjects',{id:U.uid(),name:name.value.trim(),color});
          App.renderMain(); this.subjects();
        }})
      ]});
  },
  materials(){
    const body=el('div',{});
    const reload=()=>{ body.innerHTML='';
      const subjects=Store.list('subjects');
      if(!subjects.length){ body.append(el('div',{class:'empty',text:'先に科目を登録してください'})); return; }
      subjects.forEach(s=>{
        body.append(el('div',{class:'sect-title',style:'margin-top:16px;',text:s.name}));
        const mats=Store.list('materials').filter(m=>m.subjectId===s.id);
        if(!mats.length) body.append(el('div',{class:'sub',style:'color:var(--fg-faint);font-size:12px;padding:4px 0;',text:'なし'}));
        mats.forEach(m=>body.append(el('div',{class:'list-item'},[
          el('div',{class:'grow',text:m.name}),
          el('button',{class:'btn-ghost',text:'編集',onclick:()=>this.materialForm(m,s.id,reload)}),
          el('button',{class:'btn-ghost',text:'✕',onclick:()=>{Store.remove('materials',m.id);reload();}}),
        ])));
        body.append(el('button',{class:'btn-ghost',style:'margin-top:6px;',text:'+ 教材を追加',onclick:()=>this.materialForm(null,s.id,reload)}));
      });
    };
    reload();
    Modal.open({title:'教材を管理',body:[body]});
  },
  materialForm(m,subjectId,after){
    const editing=!!m;
    const name=el('input',{class:'input',value:m?m.name:'',placeholder:'例: 単語帳'});
    Modal.open({title:editing?'教材を編集':'教材を追加',
      body:[ el('div',{class:'field'},[el('label',{text:`科目: ${U.subj(subjectId).name}`}),name]) ],
      footer:[
        el('button',{class:'btn btn-ghost',text:'戻る',onclick:()=>this.materials()}),
        el('button',{class:'btn btn-primary',text:'保存',onclick:()=>{
          if(!name.value.trim()){toast('名前を入力してください');return;}
          if(editing) Store.update('materials',m.id,{name:name.value.trim()});
          else Store.add('materials',{id:U.uid(),subjectId,name:name.value.trim()});
          App.renderMain(); this.materials();
        }})
      ]});
  },
  locations(){
    const body=el('div',{});
    const reload=()=>{ body.innerHTML='';
      Store.list('locations').forEach(l=>body.append(el('div',{class:'list-item'},[
        el('div',{style:'font-size:20px;width:28px;text-align:center;',text:l.emoji||'📍'}),
        el('div',{class:'grow',text:l.name}),
        el('button',{class:'btn-ghost',text:'編集',onclick:()=>this.locationForm(l,reload)}),
        el('button',{class:'btn-ghost',text:'✕',onclick:()=>{Store.remove('locations',l.id);reload();App.renderMain();}}),
      ])));
      body.append(el('button',{class:'btn btn-block',style:'margin-top:14px;',text:'+ 場所を追加',onclick:()=>this.locationForm(null,reload)}));
    };
    reload();
    Modal.open({title:'場所を管理',body:[body]});
  },
  locationForm(l){
    const editing=!!l;
    const emoji=el('input',{class:'input',value:l?l.emoji:'',placeholder:'🏠',maxlength:'4',style:'text-align:center;'});
    const name=el('input',{class:'input',value:l?l.name:'',placeholder:'例: 自宅'});
    Modal.open({title:editing?'場所を編集':'場所を追加',
      body:[ el('div',{class:'row'},[
        el('div',{class:'field',style:'flex:0 0 90px;'},[el('label',{text:'絵文字'}),emoji]),
        el('div',{class:'field'},[el('label',{text:'名前 NAME'}),name]),
      ]) ],
      footer:[
        el('button',{class:'btn btn-ghost',text:'戻る',onclick:()=>this.locations()}),
        el('button',{class:'btn btn-primary',text:'保存',onclick:()=>{
          if(!name.value.trim()){toast('名前を入力してください');return;}
          if(editing) Store.update('locations',l.id,{name:name.value.trim(),emoji:emoji.value.trim()});
          else Store.add('locations',{id:U.uid(),name:name.value.trim(),emoji:emoji.value.trim()});
          App.renderMain(); this.locations();
        }})
      ]});
  },
  profile(){
    const prof=Store.get('profile');
    const name=el('input',{class:'input',value:prof.name||'',placeholder:'ユーザー名'});
    Modal.open({title:'プロフィール編集',
      body:[ el('div',{class:'field'},[el('label',{text:'ユーザー名 USERNAME'}),name]) ],
      footer:[ el('button',{class:'btn btn-ghost',text:'戻る',onclick:()=>this.open()}),
        el('button',{class:'btn btn-primary',text:'保存',onclick:()=>{Store.patch('profile',{name:name.value.trim()});Modal.close();App.renderShell();App.renderMain();}}) ]});
  },
  exportData(){
    const data=Store.export(); data.exportedAt=new Date().toISOString();
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=el('a',{href:url,download:`studymanager_${U.ymd(new Date())}.json`}); document.body.append(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    toast('JSONを書き出しました');
  },
  logout(){
    confirmDialog('ログアウトしますか？（データは保持されます）',()=>{
      Store.patch('session',{active:false}); Modal.close(); App.boot();
    },'ログアウト',false);
  },
  reset(){
    confirmDialog('全ての記録・目標・設定・アカウントを削除します。\nこの操作は取り消せません。',async ()=>{
      if(Auth.enabled() && Auth.loggedIn()){
        try{
          const token = await Auth.validToken();
          await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:delete?key=${encodeURIComponent(Auth.cfg().apiKey)}`,{
            method:'POST',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({idToken:token})
          });
        }catch(e){}
        Auth.clear();
      }
      Store.reset(); Modal.close();
      State.timer={running:false,startTs:null,elapsedSec:0}; State.sel={subjectId:null,materialId:null,locationId:null};
      App.boot();
    });
  }
};

/* ---------------- shared view head ---------------- */
function viewHead(title,tag,sub){
  const h=el('div',{});
  h.append(el('div',{class:'view-head'},[ el('h1',{text:title}), el('span',{class:'tag',text:tag}) ]));
  if(sub) h.append(el('div',{class:'view-sub',text:sub}));
  return h;
}

/* ---------------- toast ---------------- */
let toastT;
function toast(msg){
  let t=$('#toast');
  if(!t){ t=el('div',{id:'toast',style:'position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:var(--fg);color:var(--on-fg);padding:12px 20px;z-index:200;font-size:12px;letter-spacing:0.08em;'}); document.body.append(t); }
  t.textContent=msg; t.style.opacity='1';
  clearTimeout(toastT); toastT=setTimeout(()=>{t.style.opacity='0';},1800);
}

/* ---------------- [APP] ---------------- */
const App = {
  boot(){
    Theme.apply(Theme.current());
    if(Auth.enabled() && Auth.loggedIn()){
      this.renderSyncing();
      Cloud.initialSync()
        .then(()=>this._afterLogin())
        .catch(()=>{ toast('オフライン: ローカルのデータで起動します'); this._afterLogin(); });
      return;
    }
    const prof=Store.get('profile'); const sess=Store.get('session');
    if(!sess.active || !prof.name){ this.renderSetup(); }
    else { this.enterApp(); }
  },
  _afterLogin(){
    if(!(Store.get('profile')||{}).name){ Store.patch('profile',{name:(Auth.email()||'user').split('@')[0]}); }
    Store.patch('session',{active:true});
    this.enterApp();
  },
  enterApp(){
    this.renderShell(); this.renderMain();
    if(!Store.get('settings').tutorialDone) this.showTutorial();
  },

  showTutorial(){
    const steps=[
      { num:'01', icon:'📚', title:'科目を追加する',
        desc:'右上のアバターボタン → メニュー →「科目を管理」\nアプリで使う科目（英語・数学など）を登録してください。\n科目がないと記録ができません。' },
      { num:'02', icon:'⏱', title:'学習を記録する',
        desc:'record タブ → STOPWATCH（計測しながら記録）\nまたは MANUAL（後から時間を入力）\n科目・時間・場所を選んで「保存」します。' },
      { num:'03', icon:'🎯', title:'目標を設定する',
        desc:'goals タブ → 右下の「＋」ボタン\n科目ごとに目標時間を設定すると、\n進捗バーで達成度を確認できます。' },
    ];
    Modal.open({
      title:'HOW TO START — 始め方',
      body:[
        el('p',{style:'font-size:12px;color:var(--fg-dim);line-height:1.7;margin-bottom:20px;',
          text:'まず右上のメニューから科目を追加してください。科目を作るとすべての機能が使えるようになります。'}),
        ...steps.map(s=>el('div',{class:'t-step'},[
          el('div',{class:'t-num',text:s.num}),
          el('div',{class:'t-icon',text:s.icon}),
          el('div',{},[
            el('div',{class:'t-title',text:s.title}),
            el('div',{class:'t-desc',text:s.desc}),
          ]),
        ])),
        el('button',{class:'btn btn-primary btn-block btn-lg',style:'margin-top:24px;',
          text:'はじめる GET STARTED',onclick:()=>{
            Store.patch('settings',{tutorialDone:true});
            Modal.close();
          }}),
        el('div',{class:'mono-up',style:'text-align:center;margin-top:14px;color:var(--fg-faint);',
          text:'メニューはいつでも右上のアバターから開けます'}),
      ]
    });
  },
  renderSyncing(){
    const app=$('#app'); app.innerHTML='';
    app.append(el('div',{class:'setup fade'},[
      el('div',{class:'glyph-lg'}),
      el('div',{class:'big',text:'studymanager'}),
      el('p',{text:'同期中… SYNCING'}),
    ]));
  },
  renderSetup(){ if(Auth.enabled()) this.renderAuth(); else this.renderLocalSetup(); },
  renderAuth(){
    const app=$('#app'); app.innerHTML='';
    const email=el('input',{class:'input',type:'email',placeholder:'メールアドレス',autocomplete:'email'});
    const pw=el('input',{class:'input',type:'password',placeholder:'パスワード（6文字以上）',autocomplete:'current-password'});
    const msg=el('div',{class:'auth-msg'});
    function setBusy(b){ btnLogin.disabled=b; btnSignup.disabled=b; }
    async function submit(mode){
      const e=(email.value||'').trim(), p=(pw.value||'');
      if(!e){ msg.textContent='メールアドレスを入力してください'; return; }
      if(!p || p.length<6){ msg.textContent='パスワードは6文字以上で入力してください'; return; }
      setBusy(true); msg.textContent='通信中…';
      try{
        if(mode==='signup') await Auth.signUp(e,p); else await Auth.signIn(e,p);
        msg.textContent='同期中…';
        await Cloud.initialSync().catch(()=>{});
        App._afterLogin();
      }catch(err){ msg.textContent=err.message||'エラーが発生しました'; setBusy(false); }
    }
    const btnLogin=el('button',{class:'btn btn-accent btn-block btn-lg',text:'ログイン',onclick:()=>submit('login')});
    const btnSignup=el('button',{class:'btn btn-block',style:'margin-top:10px;',text:'新規登録',onclick:()=>submit('signup')});
    pw.addEventListener('keydown',e=>{ if(e.key==='Enter') submit('login'); });
    app.append(el('div',{class:'setup fade'},[
      el('div',{class:'glyph-lg'}),
      el('div',{class:'big',text:'studymanager'}),
      el('p',{text:'login to sync across devices'}),
      el('div',{class:'form'},[
        el('div',{class:'field'},[ el('label',{text:'メール EMAIL'}), email ]),
        el('div',{class:'field'},[ el('label',{text:'パスワード PASSWORD'}), pw ]),
        msg, btnLogin, btnSignup,
        el('button',{class:'link-btn',text:'アカウントを使わず、この端末だけで使う →',onclick:()=>App.renderLocalSetup()}),
      ]),
    ]));
  },
  renderLocalSetup(){
    const app=$('#app');
    const name=el('input',{class:'input',placeholder:'ユーザー名を入力',value:Store.get('profile').name||''});
    const go=()=>{ if(!name.value.trim()){toast('名前を入力してください');return;}
      Store.patch('profile',{name:name.value.trim()}); Store.patch('session',{active:true}); App.enterApp(); };
    name.addEventListener('keydown',e=>{if(e.key==='Enter')go();});
    app.innerHTML='';
    app.append(el('div',{class:'setup fade'},[
      el('div',{class:'glyph-lg'}),
      el('div',{class:'big',text:'studymanager'}),
      el('p',{text:'plan · track · review'}),
      el('div',{class:'form'},[
        el('div',{class:'field'},[ el('label',{text:'ようこそ — WHO ARE YOU?'}), name ]),
        el('button',{class:'btn btn-accent btn-block btn-lg',text:'はじめる START',onclick:go}),
        (Auth.enabled()? el('button',{class:'link-btn',text:'← アカウントでログイン（他端末と同期）',onclick:()=>App.renderAuth()}) : null),
      ]),
      el('div',{class:'mono-up',style:'margin-top:24px;',text: Store.persistent?'data: local storage':'data: memory only'}),
    ]));
  },
  renderShell(){
    const app=$('#app');
    app.innerHTML='';
    const prof=Store.get('profile');
    const avatarTxt=(prof.name||'?').slice(0,1).toUpperCase();
    const collapsed=!!(Store.get('settings')||{}).navCollapsed;
    const sidenav=el('div',{class:'sidenav'});
    const navToggle=el('button',{id:'navToggle',class:'nav-toggle',title:collapsed?'ナビを展開':'ナビを折りたたむ',onclick:()=>this.toggleNav()},[ el('span',{class:'ico',text:collapsed?'»':'«'}) ]);
    sidenav.append(el('div',{class:'sidenav-head'},[
      el('div',{class:'brand'},[ el('div',{class:'glyph'}), el('div',{class:'name',text:'STUDYMGR'}) ]),
      navToggle,
    ]));
    CONFIG.TABS.forEach(t=>sidenav.append(this.navBtn(t)));
    const topbar=el('div',{class:'topbar'},[
      el('div',{class:'brand'},[ el('div',{class:'glyph'}), el('div',{class:'name',text:'STUDYMGR'}) ]),
      el('span',{class:'sync-badge'}),
      el('button',{class:'avatar',text:avatarTxt,onclick:()=>Manage.open()}),
    ]);
    const pctop=el('div',{class:'pc-topbar'},[ el('span',{class:'sync-badge'}), el('button',{class:'avatar',text:avatarTxt,onclick:()=>Manage.open()}) ]);
    const main=el('main',{class:'main',id:'main'});
    const contentCol=el('div',{class:'content-col'},[ pctop, main ]);
    const bottom=el('nav',{class:'bottomnav'});
    CONFIG.TABS.forEach(t=>bottom.append(this.navBtn(t)));
    app.append(el('div',{class:'app-shell'+(collapsed?' nav-collapsed':'')},[ sidenav, contentCol ]), topbar, bottom);
    app.prepend(topbar);
    this.updateNav();
    this.updateSyncBadge();
  },
  updateSyncBadge(){
    const show = Auth.enabled() && Auth.loggedIn();
    const map={ syncing:['同期中…',''], synced:['● 同期済','ok'], offline:['● オフライン','warn'], idle:['',''] };
    $$('.sync-badge').forEach(b=>{
      if(!show){ b.textContent=''; b.className='sync-badge'; return; }
      const m=map[Cloud.status]||['',''];
      b.textContent=m[0]; b.className='sync-badge'+(m[1]?(' '+m[1]):'');
    });
  },
  navBtn(t){
    return el('button',{class:'nav-item'+(State.tab===t.id?' active':''),'data-tab':t.id,onclick:()=>this.go(t.id)},[
      el('span',{class:'idx',text:t.idx}), el('span',{class:'lbl',text:t.label}),
    ]);
  },
  updateNav(){ $$('.nav-item').forEach(b=>b.classList.toggle('active', b.getAttribute('data-tab')===State.tab)); },
  toggleNav(){
    const collapsed = !((Store.get('settings')||{}).navCollapsed);
    Store.patch('settings',{navCollapsed:collapsed});
    const shell=$('.app-shell'); if(shell) shell.classList.toggle('nav-collapsed', collapsed);
    const btn=$('#navToggle');
    if(btn){ btn.title=collapsed?'ナビを展開':'ナビを折りたたむ'; const ico=btn.querySelector('.ico'); if(ico) ico.textContent=collapsed?'»':'«'; }
  },
  go(tab){ State.tab=tab; this.updateNav(); this.renderMain(); window.scrollTo(0,0); },
  renderMain(){
    const m=$('#main'); if(!m) return;
    m.innerHTML='';
    Views[State.tab].mount(m);
    const oldFab=$('#fab'); if(oldFab)oldFab.remove();
    if(State.tab==='goals'){
      document.body.append(el('button',{id:'fab',class:'fab',text:'+',title:'目標を追加',onclick:()=>Views.goals.form(null)}));
    }
  },
};

setInterval(()=>{
  const t=State.timer; if(!t.running) return;
  const d=$('#sw-display'); if(d){ d.textContent=U.clock(t.elapsedSec+(Date.now()-t.startTs)/1000); }
},1000);

App.boot();

/* 全画面ボタン（左下・1回だけ生成） */
(function(){
  const btn=el('button',{id:'fs-btn',class:'fs-btn',title:'全画面 / 解除'});
  btn.textContent='⛶';
  btn.addEventListener('click',()=>{
    if(!document.fullscreenElement){
      document.documentElement.requestFullscreen().catch(()=>{});
    } else {
      document.exitFullscreen().catch(()=>{});
    }
  });
  document.addEventListener('fullscreenchange',()=>{
    btn.textContent = document.fullscreenElement ? '⊡' : '⛶';
  });
  document.body.append(btn);
})();
</script>
